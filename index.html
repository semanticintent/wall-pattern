<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>WALL Pattern</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round' role='img' aria-label='WALL Pattern' stroke='%23d97706' color='%23d97706'><path d='M2.5 5h19M2.5 12h19M2.5 19h19'/><path d='M8.5 5v7M15.5 5v7M5 12v7M12 12v7M19 12v7'/><circle cx='12' cy='8.5' r='1.6' fill='currentColor' stroke='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E13;--surface:#111821;--surface2:#16202B;--line:#223040;--btnline:#2B3B4D;
  --text:#E9EEF3;--strong:#F4F7FA;--muted:#93A1B2;--soft:#B8C4D1;--faint:#6E7C8C;
  --accent:#63B3FF;--onaccent:#0A0E13;--better:#7CC4FF;--betterbg:rgba(99,179,255,.14);
  --worse:#FFA66B;--worsebg:rgba(255,155,87,.15);--neutralbg:rgba(184,196,209,.10);
  --conn:#34475C;--chev:#5D7894;--loop:#4F86B5;--spoke:#FF8A5C;--exfg:#FFB8A6;--exbg:rgba(255,106,77,.14);
  --flash:rgba(99,179,255,.30);--fade:14s;
  --f-head:'Space Grotesk',system-ui,sans-serif;--f-body:Inter,system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
}
.light{
  --bg:#F3F6F9;--surface:#FFFFFF;--surface2:#EEF2F6;--line:#D5DDE6;--btnline:#C3CEDA;
  --text:#18222D;--strong:#0B121A;--muted:#5B6B7C;--soft:#3C4A59;--faint:#8796A6;
  --accent:#1F6FD1;--onaccent:#FFFFFF;--better:#1A64C2;--betterbg:rgba(31,111,209,.12);
  --worse:#B4510A;--worsebg:rgba(194,87,12,.12);--neutralbg:rgba(60,74,89,.08);
  --conn:#A9B7C6;--chev:#7D8FA3;--loop:#3B78B0;--spoke:#E06A3A;--exfg:#A8391C;--exbg:rgba(224,106,58,.12);
  --flash:rgba(31,111,209,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--f-body);color:var(--text)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;transform-origin:center center;background:var(--bg);overflow:hidden;flex:none}
button{font-family:var(--f-body)}
.abs{position:absolute}
/* header */
.hdr-l{position:absolute;left:64px;top:40px;display:flex;flex-direction:column;gap:8px;z-index:20}
.eyebrow{font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--better)}
h1{margin:0;font-family:var(--f-head);font-size:44px;line-height:52px;font-weight:600;letter-spacing:-.01em;color:var(--strong)}
.hdr-r{position:absolute;right:64px;top:32px;display:flex;flex-direction:column;align-items:flex-end;gap:12px;z-index:20}
.hrow{display:flex;align-items:center;gap:14px}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft);margin-right:6px}
.status b{color:var(--text);font-weight:600}
.status .t{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.status .src{font-size:12px;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:999px}
.beat{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--betterbg);animation:beat 1.6s ease-in-out infinite}
.beat.off{background:var(--faint);box-shadow:none;animation:none}
.beat.err{background:#FF6A4D;box-shadow:0 0 0 4px rgba(255,106,77,.2)}
.btn{height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--btnline);background:var(--surface2);color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--onaccent);border:none}
.btn.ghost{background:transparent;color:var(--soft);font-size:13px;padding:0 16px}
.btn:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp{display:flex;align-items:center;gap:10px}
.glabel{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pills{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.pill{height:36px;padding:0 14px;border-radius:999px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:transparent;color:var(--soft)}
.pill[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.kiosk .hdr-r .hide-k{display:none}
.progress{position:absolute;left:64px;right:64px;top:146px;height:3px;border-radius:3px;background:var(--surface2);overflow:hidden;z-index:20}
.progress i{display:block;height:3px;width:0;background:var(--accent)}
.looplabel{position:absolute;left:64px;top:162px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
/* cards */
.card{position:absolute;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;touch-action:none;user-select:none;transition:transform .12s,box-shadow .3s,border-color .3s}
.card.row{padding:22px;gap:14px}
.card.compact{padding:18px;gap:9px;border-radius:18px}
.card.drag{cursor:grab}.card.dragging{cursor:grabbing;transform:scale(1.03);z-index:15}
.c-top{display:flex;justify-content:space-between;align-items:center;height:24px}
.c-num{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--muted)}
.c-right{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.compact .chip{font-size:11px;padding:3px 9px}
.chip i{width:6px;height:6px;border-radius:50%}
.chip.pulse i{animation:beat 1.6s ease-in-out infinite}
.c-name{font-family:var(--f-head);font-size:22px;line-height:28px;font-weight:600;color:var(--text)}
.compact .c-name{font-size:20px;line-height:24px}
.c-sub{font-size:13px;color:var(--muted);margin-top:-10px}
.hero{display:flex;flex-direction:column;gap:2px;padding:6px 8px;margin:0 -8px;border-radius:10px}
.compact .hero{padding:2px 8px}
.hval-row{display:flex;align-items:center;gap:10px}
.hval{font-family:var(--f-head);font-size:48px;line-height:56px;font-weight:600;color:var(--strong);font-variant-numeric:tabular-nums}
.compact .hval{font-size:38px;line-height:44px}
.hcap{font-size:13px;color:var(--muted)}
.compact .hcap{font-size:12px}
.sep{height:1px;background:var(--line)}
.rows{display:flex;flex-direction:column;gap:2px}
.r{display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 8px;margin:0 -8px;border-radius:8px}
.compact .r{height:26px}
.r .l{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
.compact .r .l{font-size:13px}
.r .v{display:flex;align-items:center;gap:8px}
.r .n{font-family:var(--f-head);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:32px;text-align:right;color:var(--text)}
.compact .r .n{font-size:16px}
.tdot{width:8px;height:8px;border-radius:50%;flex:none}
.tdot.p{animation:beat 1.6s ease-in-out infinite}
.c-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.compact .c-foot{flex-direction:row;justify-content:space-between}
.age.over{color:var(--worse)}
.exb{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--exfg);background:var(--exbg)}
.exb.none{color:var(--muted);background:var(--surface2)}
.exb.mini{height:22px;padding:0 8px;font-size:11px}
.flash{animation:flash 2s ease-out 1}
.delta{display:inline-flex;align-items:center;flex:none;font-family:var(--f-mono);font-weight:600;line-height:18px;border-radius:999px;font-size:13px;padding:2px 7px}
.delta.big{font-size:15px;padding:3px 9px}
.delta.better{color:var(--better);background:var(--betterbg)}
.delta.worse{color:var(--worse);background:var(--worsebg)}
.delta.neutral{color:var(--soft);background:var(--neutralbg)}
.delta.fresh{animation:fade var(--fade) ease-out forwards}
.delta.stale{opacity:.7}
/* connectors */
#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#lines path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.chev{position:absolute;width:16px;height:16px;display:flex;color:var(--chev);pointer-events:none}
.chev.stall{color:#F2C14E}
.flow{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.flow .cnt{font-family:var(--f-head);font-size:17px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.flow .cnt.zero{color:var(--faint)}
.flow .cnt.fresh{display:inline-block;animation:fade var(--fade) ease-out forwards}
.flow .cap{font-size:12px;color:var(--muted)}
.flow.stall .cnt,.flow.stall .cap{color:#F6D27A;font-weight:600}
.flow .sw{margin-top:2px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1a1408;background:#F2C14E}
.flow.loop .cap{max-width:260px}
.flow.loop .ln{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--loop);text-transform:uppercase}
/* hub */
.halo{position:absolute;width:360px;height:360px;border-radius:50%;border:1px dashed var(--line);pointer-events:none;animation:halo 120s linear infinite}
.hub{position:absolute;width:248px;height:248px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface);border:1px solid var(--line);touch-action:none;user-select:none;z-index:12;transition:box-shadow .3s,border-color .3s}
.hub .ttl{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.hub .tot{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:12px}
.hub .tot b{font-family:var(--f-head);font-size:60px;line-height:68px;font-weight:600;color:var(--strong);font-variant-numeric:tabular-nums}
.hub .types{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--soft)}
.hub .types b{color:var(--strong)}
/* panels */
.panel{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column}
.p-title{font-family:var(--f-head);font-size:22px;font-weight:600;color:var(--text)}
.p-sub{font-size:13px;color:var(--muted)}
.ex-grid{display:grid;gap:16px}
.ex-tile{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface2);border-radius:12px;min-width:0}
.ex-tile .nm{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ex-tile .ct{display:flex;align-items:center;gap:10px}
.ex-tile .ct b{font-family:var(--f-head);font-size:40px;line-height:46px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--strong)}
.ex-tile .lts{display:flex;flex-direction:column;min-width:0}
.ex-tile .lt{font-size:13px;line-height:18px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-tile .lt.more{color:var(--faint)}
.where{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.where span.s{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:999px;background:var(--surface2);font-size:13px;color:var(--soft)}
.where span.s b{color:var(--strong)}
.log{display:flex;flex-direction:column;gap:2px}
.log .e{display:flex;align-items:center;gap:12px;height:32px;padding:0 8px;margin:0 -8px;border-radius:8px}
.log .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;width:68px}
.log .tx{flex:1;min-width:0;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .empty{font-size:14px;color:var(--muted);padding:12px 0}
.footer{position:absolute;left:64px;display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted)}
.footer .sw{display:inline-flex;align-items:center;gap:6px}
.footer .sw i{width:8px;height:8px;border-radius:50%}
.footer .bar{color:var(--faint)}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:var(--surface);border-left:1px solid var(--line);z-index:100;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;gap:20px;padding:28px;overflow:auto;color:var(--text)}
#drawer.open{transform:none;box-shadow:-24px 0 60px rgba(0,0,0,.35)}
#drawer h2{margin:0;font-family:var(--f-head);font-size:24px}
#drawer h3{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#drawer p,#drawer li{font-size:14px;line-height:21px;color:var(--soft);margin:0}
#drawer .sec{display:flex;flex-direction:column;gap:10px}
#drawer label{font-size:13px;color:var(--soft);display:flex;flex-direction:column;gap:6px}
#drawer input[type=url],#drawer input[type=number]{height:40px;border-radius:10px;border:1px solid var(--btnline);background:var(--bg);color:var(--text);padding:0 12px;font:14px var(--f-body)}
#drawer .row2{display:flex;gap:8px;flex-wrap:wrap}
#drawer code{font-family:var(--f-mono);font-size:12px;background:var(--surface2);padding:2px 6px;border-radius:6px;word-break:break-all}
#drawer .btn{height:40px;font-size:13px;padding:0 16px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#explain-marks{position:absolute;inset:0;pointer-events:none;z-index:40}
#explain-marks .mk{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent,#7CC4FF);color:#08111a;font:700 14px var(--f-head);box-shadow:0 0 0 4px rgba(124,196,255,.22)}
#explain-panel{position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:400px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;z-index:90;background:var(--surface);border:1px solid var(--btnline);border-radius:16px;padding:22px 24px;color:var(--text);box-shadow:0 24px 64px rgba(0,0,0,.45);font-size:14px;line-height:1.5}
#explain-panel h2{font:600 20px var(--f-head);margin:0 0 4px}
#explain-panel .sub{color:var(--muted);margin:0 0 14px}
#explain-panel ol{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:10px}
#explain-panel li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
#explain-panel li i{width:24px;height:24px;border-radius:50%;background:var(--accent,#7CC4FF);color:#08111a;font:700 12px var(--f-head);font-style:normal;display:flex;align-items:center;justify-content:center}
#explain-panel b{color:var(--strong)}
#explain-panel .rules{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px;color:var(--soft)}
#explain-panel .close{position:absolute;top:14px;right:14px;background:transparent;border:1px solid var(--btnline);color:var(--soft);border-radius:999px;padding:4px 12px;font:600 12px var(--f-body);cursor:pointer}
#explain-panel .close:focus-visible{outline:2px solid var(--accent,#7CC4FF);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--btnline);color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80vw}
#toast.show{opacity:1}
#toast.err{border-color:#FF6A4D}
#dropzone{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(10,14,19,.8);color:#E9EEF3;font:600 24px var(--f-head);border:3px dashed var(--accent)}
#dropzone.on{display:flex}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes flash{0%{background-color:var(--flash)}100%{background-color:transparent}}
@keyframes fade{0%{opacity:1;transform:scale(1.18)}8%{transform:scale(1)}70%{opacity:1}100%{opacity:.5}}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes halo{to{transform:rotate(360deg)}}
@keyframes prog{from{width:0}to{width:100%}}
@media (prefers-reduced-motion: reduce){.rm *{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="viewport"><div id="stage" aria-live="off"></div></div>
<aside id="drawer" aria-label="Wall settings" aria-hidden="true"></aside>
<aside id="explain-panel" aria-label="How to read this wall" hidden></aside>
<div id="toast" role="status"></div>
<div id="dropzone">Drop a wall config, a feed, or both (.json) · nothing leaves your browser</div>

/* ---------- delta window: when the 'since' baseline resets ---------- */
const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
function windowStart(now) {
  const d = S.config.display.delta, t = new Date(now);
  t.setSeconds(0, 0);

  if (d.window === 'week') {
    t.setHours(0, 0, 0, 0);
    const ws = Math.max(0, WEEKDAYS.indexOf(String(d.weekStart || 'monday').toLowerCase()));
    t.setDate(t.getDate() - ((t.getDay() - ws + 7) % 7));
    return t;
  }
  const sh = String(d.shiftStart || '07:00').split(':');
  t.setHours(+sh[0] || 0, +sh[1] || 0, 0, 0);
  if (t > now) t.setDate(t.getDate() - 1);

}

}

/* ---------- feed ingestion ---------- */
function ingest(feed, why) {
  const errs = checkFeed(feed);
  if (errs.length) { toast('Feed problem: ' + errs[0], true); return; }
  if (feed.wallId && S.config && feed.wallId !== S.config.id) toast('Note: feed is for "' + feed.wallId + '", wall is "' + S.config.id + '".', true);
  S.prev = S.feed;
  S.feed = feed;
  S.error = null;
  (feed.exceptions || []).forEach((e) => { if (!S.exPool.some((p) => p.text === e.text)) S.exPool.push({ type: e.type, step: e.step, text: e.text }); });
  if (feed.baseline && feed.baseline.values) S.base = feed.baseline;
  else if (!S.base || new Date(S.base.at) < windowStart(feedTime(feed))) S.base = { at: feed.generatedAt, values: clone(feed.values) };

  else (feed.messages || []).forEach((m) => pushLog(feed, m.text, null, m.tone || 'neutral'));

  S.logSeq += 1;

  (cur.messages || []).forEach((m) => { if (!(prev.messages || []).some((x) => x.text === m.text)) pushLog(cur, m.text, null, m.tone || 'neutral'); });
  const moved = S.config.connectors.map((k) => {
    const fl = cur.flows && cur.flows[k.id];
    const n = fl && fl.sinceLastUpdate > 0 ? fl.sinceLastUpdate : 0;
    return n ? (k.caption || ((S.stepById[k.from] || {}).name + ' → ' + (S.stepById[k.to] || {}).name)) + ' +' + n.toLocaleString('en-US') : '';

    const a = prev.values[id], b = cur.values[id], def = S.ind[id].def;

/* ---------- geometry: lines, chevrons, flow labels ---------- */

          '<animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.12;.88;1" dur="' + dur.toFixed(2) + 's" begin="-' + (dur * i / 3).toFixed(2) + 's" repeatCount="indefinite"></animate></circle>';

/* ---------- watch a local file (File System Access API) ---------- */
const canWatch = typeof window.showOpenFilePicker === 'function';
function idb(mode, fn) {
  return new Promise((resolve) => {
    try {
      const open = indexedDB.open('wallpattern', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('handles');
      open.onerror = () => resolve(null);
      open.onsuccess = () => {
        try {
          const tx = open.result.transaction('handles', mode);
          const req = fn(tx.objectStore('handles'));
          tx.oncomplete = () => resolve(req && req.result);
          tx.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      };
    } catch (e) { resolve(null); }
  });
}
const handleKey = () => 'feed:' + (S.config ? S.config.id : '');
function saveHandle(h) { return idb('readwrite', (st) => (h ? st.put(h, handleKey()) : st.delete(handleKey()))); }
function loadHandle() { return idb('readonly', (st) => st.get(handleKey())); }

/* ---------- demo simulator ---------- */
function synthFeed(c) {
  const values = {}, base = {};
  c.steps.forEach((s) => {
    [s.hero].concat(s.indicators).forEach((d) => {
      let v;
      const t = d.thresholds;
      if (d.cumulative) { v = 20 + Math.floor(Math.random() * 60); base[d.id] = 0; values[d.id] = v; return; }
      if (t && (t.watch != null || t.act != null)) {
        const ref = t.watch != null ? t.watch : t.act;
        v = (t.direction || 'above') === 'above' ? Math.max(0, R(ref * (0.6 + Math.random() * 0.6))) : R(ref * (1.0 + Math.random() * 0.4));
      } else v = 10 + Math.floor(Math.random() * 190);
      if (d.format === 'percent') v = Math.min(100, v);
      values[d.id] = v; base[d.id] = v;
    });
  });
  const flows = {};
  c.connectors.forEach((k) => { flows[k.id] = { sinceLastUpdate: 0, sinceShiftStart: 10 + Math.floor(Math.random() * 60) }; });
  const ages = {};
  c.steps.forEach((s) => { ages[s.id] = { oldestHours: s.age && s.age.targetHours != null ? R(s.age.targetHours * (0.5 + Math.random())) : R(Math.random() * 72) }; });
  const exceptions = [];
  const types = c.exceptions.types.length ? c.exceptions.types : [{ id: 'ops', label: 'Operations' }];
  for (let i = 0; i < Math.min(8, c.steps.length * 2); i++) {
    const s = c.steps[i % c.steps.length], t = types[i % types.length];
    exceptions.push({ id: 'DEMO-' + (S.idSeq++), type: t.id, step: s.id, text: t.label + ' issue at ' + s.name });
  }
  const at = windowStart(new Date());
  return { schemaVersion: '1.0', wallId: c.id, generatedAt: new Date().toISOString(), sequence: 1, values: values, baseline: { at: at.toISOString(), values: base }, ages: ages, flows: flows, exceptions: exceptions };
}
function simulate(f) {
  const c = S.config;
  if (!f) return synthFeed(c);
  const n = clone(f);
  n.generatedAt = new Date().toISOString();
  n.sequence = (f.sequence || 0) + 1;
  delete n.messages;
  Object.keys(S.ind).forEach((id) => {
    const def = S.ind[id].def;
    let v = n.values[id];
    if (v == null || Math.random() >= 0.3) return;
    const step = Math.max(3, R(Math.abs(v) * 0.005));
    let d = 1 + Math.floor(Math.random() * step);
    if (!def.cumulative && Math.random() < 0.5) d = -d;
    v = Math.max(0, v + d);
    if (def.format === 'percent') v = Math.min(100, v);
    n.values[id] = v;
  });
  n.flows = n.flows || {};
  c.connectors.forEach((k) => {
    const fl = n.flows[k.id] || { sinceShiftStart: 0 };
    const inc = Math.random() < 0.5 ? 1 + Math.floor(Math.random() * 3) : 0;
    n.flows[k.id] = { sinceLastUpdate: inc, sinceShiftStart: (fl.sinceShiftStart || 0) + inc };
  });
  n.ages = n.ages || {};
  c.steps.forEach((s) => { const a = n.ages[s.id]; if (a) a.oldestHours = Math.max(0, a.oldestHours + (Math.random() < 0.5 ? -1 : 1)); });
  n.exceptions = (n.exceptions || []).slice();
  if (Math.random() < 0.45) {
    const pool = S.exPool.length ? S.exPool : [{ type: (c.exceptions.types[0] || { id: 'ops' }).id, step: c.steps[0].id, text: 'New issue at ' + c.steps[0].name }];
    const p = pool[Math.floor(Math.random() * pool.length)];
    n.exceptions.unshift({ id: 'DEMO-' + (S.idSeq++), type: p.type, step: p.step, text: p.text, openedAt: n.generatedAt });
  }
  if (Math.random() < 0.35 && n.exceptions.length > 3) n.exceptions.splice(1 + Math.floor(Math.random() * (n.exceptions.length - 1)), 1);

}

  if (!S.explain || !S.config) { if (layer) layer.remove(); return; }
  if (!layer) { layer = document.createElement('div'); layer.id = 'explain-marks'; layer.setAttribute('aria-hidden', 'true'); stage.appendChild(layer); }
  const card = document.getElementById('card-' + S.config.steps[0].id);
  if (!card) { layer.innerHTML = ''; return; }
  const k = S.scale || 1, sr = stage.getBoundingClientRect(), cr = card.getBoundingClientRect();
  const q = (sel) => card.querySelector(sel);
  const left = (el) => { if (!el) return null; const r = el.getBoundingClientRect(); return [(cr.left - sr.left) / k, (r.top + r.height / 2 - sr.top) / k]; };
  const right = (el) => { if (!el) return null; const r = el.getBoundingClientRect(); return [(r.right - sr.left) / k + 22, (r.top + r.height / 2 - sr.top) / k]; };
  const hero = q('.hero .delta') ? right(q('.hero .delta')) : right(q('.hval'));
  const spots = [left(q('.c-name')), right(q('.chip')), left(q('.hval')), hero, left(q('.rows .r')), left(q('.age')), right(q('.exb'))];
  layer.innerHTML = spots.map((s, i) => s ? '<span class="mk" style="left:' + R(s[0]) + 'px;top:' + R(s[1]) + 'px">' + (i + 1) + '</span>' : '').join('');
}
document.getElementById('explain-panel').addEventListener('click', (e) => { if (e.target.closest('[data-x]')) toggleExplain(false); });

/* ---------- drawer ---------- */
function openDrawer(on) {
  if (on) renderDrawer();
  drawer.classList.toggle('open', on);
  drawer.setAttribute('aria-hidden', on ? 'false' : 'true');
  if (on) { const f = $('button', drawer); if (f) f.focus(); }
}
function renderDrawer() {
  const here = location.href.split(/[?#]/)[0];
  drawer.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center"><h2>Source &amp; settings</h2><button class="btn" data-d="close">Close</button></div>' +
    '<div class="sec"><h3>Live feed</h3><p>Point the wall at a URL that returns a feed JSON snapshot. It is fetched on the refresh interval (Live = every 10 s).</p>' +
    '<label>Feed URL<input type="url" id="d-url" placeholder="https://…/wall-feed.json" value="' + esc(S.feedUrl) + '"></label>' +
    '<div class="row2"><button class="btn primary" data-d="connect">Connect</button><button class="btn" data-d="demo">Use demo data</button></div></div>' +
    '<div class="sec"><h3>Watch a file on this computer</h3><p>Pick a feed JSON once — for example one your business system overwrites on a schedule in a shared folder. The wall re-reads it on every refresh (Live = every 5 s) and only updates when the file has changed. Nothing is uploaded. The choice is remembered; after a reload, click “Resume watching”.</p>' +
    (canWatch ? '<div class="row2"><button class="btn primary" data-d="watch">' + (S.source === 'watch' ? 'Watch a different file…' : 'Pick a feed file to watch…') + '</button>' + (S.source === 'watch' || S.pendingHandle ? '<button class="btn" data-d="unwatch">Stop watching</button>' : '') + '</div>'
      : '<p><b>Needs Chrome or Edge.</b> In this browser, drop feed files onto the wall instead.</p>') + '</div>' +
    '<div class="sec"><h3>Files</h3><p>Load a wall config (structure) or a feed snapshot. You can also drag a .json file anywhere onto the wall.</p>' +
    '<div class="row2"><span class="btn filebtn">Load config…<input type="file" accept=".json,application/json" data-d="cfgfile"></span><span class="btn filebtn">Load feed…<input type="file" accept=".json,application/json" data-d="feedfile"></span></div>' +
    '<div class="row2"><button class="btn" data-d="dlcfg">Download current config</button><button class="btn" data-d="dlfeed">Download current feed</button></div></div>' +
    '<div class="sec"><h3>Wall-screen link</h3><p>Open the wall with options in the address:</p>' +
    '<p><code>' + esc(here) + '#config=CONFIG_URL&amp;feed=FEED_URL&amp;layout=orbit&amp;pin=1&amp;kiosk=1</code></p>' +
    '<p>layout = row | orbit · pin=1 locks blocks · kiosk=1 hides the controls (press K to toggle) · F goes full screen.</p></div>' +
    '<div class="sec"><h3>Current wall</h3><p>' + esc(S.config.title) + ' · id <code>' + esc(S.config.id) + '</code> · ' + S.config.steps.length + ' steps · ' + S.config.connectors.length + ' connectors</p></div>';
}
drawer.addEventListener('click', (e) => {
  const b = e.target.closest('[data-d]');
  if (!b) return;
  const a = b.dataset.d;
  if (a === 'close') openDrawer(false);
  else if (a === 'connect') { const u = $('#d-url').value.trim(); if (!u) { toast('Enter a feed URL first.', true); return; } startUrl(u); openDrawer(false); }
  else if (a === 'demo') { startDemo(); openDrawer(false); }
  else if (a === 'watch') { openDrawer(false); pickWatch(); }
  else if (a === 'unwatch') { stopWatch(); openDrawer(false); }
  else if (a === 'dlcfg') download((S.config.id || 'wall') + '.config.json', S.config);
  else if (a === 'dlfeed') { if (S.feed) download((S.config.id || 'wall') + '.feed.json', S.feed); else toast('No feed loaded yet.', true); }
});
drawer.addEventListener('change', (e) => {
  const inp = e.target;
  if (!inp.files || !inp.files[0]) return;
  readFile(inp.files[0], inp.dataset.d === 'cfgfile' ? 'config' : 'feed');
  inp.value = '';
});
const isConfigJSON = (j) => !!(j && Array.isArray(j.steps));
function readFile(file, hint) {
  const fr = new FileReader();
  fr.onload = () => {
    let j;
    try { j = JSON.parse(fr.result); } catch (err) { toast('That file is not valid JSON.', true); return; }
    applyLoaded(j, hint);
  };
  fr.readAsText(file);
}
function applyLoaded(j, hint) {
  {
    const kind = isConfigJSON(j) ? 'config' : j && j.values ? 'feed' : hint;
    if (kind === 'config') {
      if (applyConfig(j)) { toast('Loaded wall: ' + j.title); if (S.source === 'url' && S.feedUrl) startUrl(S.feedUrl); else if (S.source === 'watch' && S.fileHandle) startWatch(S.fileHandle); else startDemo(); }
    } else {
      clearInterval(S.timer);
      if (S.source !== 'file') { S.feed = null; S.prev = null; S.base = null; S.log = []; }
      S.source = 'file';
      ingest(j, 'file');
      renderHeader();
      schedule();
      toast('Loaded feed snapshot' + (j.generatedAt ? ' from ' + hhmmss(feedTime(j)) : '') + '. Load another to see what changed.');
    }
    openDrawer(false);
  }
}
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; $('#dropzone').classList.add('on'); } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropzone').classList.remove('on'); });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; $('#dropzone').classList.remove('on');
  // Several files at once: configs first, then feeds, so a config + feed pair lands in the right order.
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
  if (!files.length) return;
  Promise.all(files.map((f) => f.text().then((t) => { try { return JSON.parse(t); } catch (err) { return null; } }, () => null)))
    .then((list) => {
      const ok = list.filter(Boolean);
      const bad = list.length - ok.length;
      ok.filter(isConfigJSON).concat(ok.filter((j) => !isConfigJSON(j))).forEach((j) => applyLoaded(j, 'feed'));
      if (bad) toast(bad === 1 ? 'One file is not valid JSON.' : bad + ' files are not valid JSON.', true);
    });
});
setInterval(renderStatus, 5000);

/* ---------- boot ---------- */
S.kiosk = params.get('kiosk') === '1';
const cfgUrl = params.get('config');
const feedUrl = params.get('feed');
(cfgUrl ? fetchJSON(cfgUrl).catch((err) => { toast('Could not load config: ' + err.message + ' — showing the sample wall.', true); return DEFAULT_CONFIG; }) : Promise.resolve(DEFAULT_CONFIG))
  .then((cfg) => {
    if (!applyConfig(cfg)) applyConfig(DEFAULT_CONFIG);
    if (feedUrl) { startUrl(feedUrl); return; }
    startDemo();
    if (!canWatch) return;
    loadHandle().then(async (h) => {
      if (!h || typeof h.queryPermission !== 'function') return;
      try {
        const p = await h.queryPermission({ mode: 'read' });
        if (p === 'granted') startWatch(h); else { S.pendingHandle = h; renderHeader(); }
      } catch (e) {}
    });
  });
window.__wall = S;
})();
</script>
